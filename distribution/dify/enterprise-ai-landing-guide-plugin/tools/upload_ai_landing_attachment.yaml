identity:
  name: upload_ai_landing_attachment
  author: blueprint-fde
  label:
    en_US: Upload Ai Landing Attachment
    zh_Hans: 添加文本资料
description:
  human:
    en_US: 上传Dify流程已安全提取的文本，不读取本地路径或任意URL。
    zh_Hans: 上传Dify流程已安全提取的文本，不读取本地路径或任意URL。
  llm: 上传Dify流程已安全提取的文本，不读取本地路径或任意URL。
parameters:
  - name: session_id
    type: string
    required: true
    label:
      en_US: 匿名会话ID
      zh_Hans: 匿名会话ID
    human_description:
      en_US: 使用创建会话工具返回的sessionId
      zh_Hans: 使用创建会话工具返回的sessionId
    llm_description: 使用创建会话工具返回的sessionId
    form: llm
  - name: session_token
    type: string
    required: true
    label:
      en_US: 短期会话Token
      zh_Hans: 短期会话Token
    human_description:
      en_US: 仅使用创建会话返回的sessionToken，不写入日志
      zh_Hans: 仅使用创建会话返回的sessionToken，不写入日志
    llm_description: 仅使用创建会话返回的sessionToken，不写入日志
    form: llm
  - name: filename
    type: string
    required: true
    label:
      en_US: 显示文件名
      zh_Hans: 显示文件名
    human_description:
      en_US: 只用于展示的.txt文件名
      zh_Hans: 只用于展示的.txt文件名
    llm_description: 只用于展示的.txt文件名
    form: llm
  - name: text_content
    type: string
    required: true
    label:
      en_US: 资料文本
      zh_Hans: 资料文本
    human_description:
      en_US: 已经Dify安全提取的文本，最多20000字符
      zh_Hans: 已经Dify安全提取的文本，最多20000字符
    llm_description: 已经Dify安全提取的文本，最多20000字符
    form: llm
  - name: idempotency_key
    type: string
    required: false
    label:
      en_US: 幂等键
      zh_Hans: 幂等键
    human_description:
      en_US: 同一请求重试时复用；新操作使用新键
      zh_Hans: 同一请求重试时复用；新操作使用新键
    llm_description: 同一请求重试时复用；新操作使用新键
    form: llm
